name: Desktop builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/desktop-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Verify native ownership and user directories
        shell: python
        run: |
          import sys, subprocess, tempfile, time
          from pathlib import Path
          sys.path.insert(0, 'backend')
          from agent_sessions.platform_process import owns, stop_pid
          from agent_sessions.browser.process_state import OwnedProcess
          from agent_sessions.paths import state_root
          from zoneinfo import ZoneInfo
          with tempfile.TemporaryDirectory(prefix='agent-sessions-check-') as directory:
              args = ['-c', 'import time;time.sleep(30)', '--user-data-dir='+directory]
              process = subprocess.Popen([sys.executable, *args])
              try:
                  for _ in range(40):
                      if owns(process.pid, sys.executable, args): break
                      time.sleep(.05)
                  else: raise RuntimeError('Native process ownership unavailable')
                  if OwnedProcess(process.pid, sys.executable, directory).poll() is not None: raise RuntimeError('Profile ownership unavailable')
                  if not state_root().is_absolute(): raise RuntimeError('User data directory unavailable')
                  ZoneInfo('America/Los_Angeles')
              finally:
                  stop_pid(process.pid)
                  process.wait(timeout=5)
      - run: npm run check:size
      - run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Sessions-${{ runner.os }}
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

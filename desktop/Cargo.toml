[package]
name = "agent-sessions"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.4.0"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[profile.release]
strip = true
lto = "thin"
